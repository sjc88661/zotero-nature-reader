<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="utf-8" /><title>双语精读</title><link rel="stylesheet" href="chrome://zotero-nature/content/styles.css?v=0.2.9" /></head>
<body class="reader">
  <header class="reading-toolbar">
    <div class="toolbar-start">
      <button id="toggle-sidebar" class="toolbar-button" title="展开或收起阅读助手" aria-label="展开或收起阅读助手"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <button id="toggle-outline" class="toolbar-button" aria-expanded="false" aria-controls="outline-panel">目录与图表</button>
      <div class="toolbar-mode"><button id="original">原 PDF</button><button class="active" aria-current="page">双语精读</button></div>
      <span id="reading-status" class="small muted"></span>
    </div>
    <div class="reader-controls">
      <button id="toggle-highlights" class="toolbar-button" aria-pressed="true">阅读重点</button>
      <details id="appearance-menu" class="appearance-menu"><summary>文字与版式</summary><div class="appearance-popover">
        <label for="reader-font-family">英文字体</label><select id="reader-font-family"><option value="source">原论文字体</option><option value="serif">经典 · 衬线</option><option value="sans">现代 · 无衬线</option></select>
        <label for="reader-chinese-font">中文字体</label><select id="reader-chinese-font"><option value="sans">黑体 · 微软雅黑</option><option value="serif">宋体</option></select>
        <div class="setting-label"><label for="reader-font-size">字号</label><output id="font-size-value">20 px</output></div><input id="reader-font-size" type="range" min="15" max="25" step="1" value="20" />
        <div class="setting-label"><label for="reader-width">纸面宽度</label><output id="width-value">适应窗口</output></div><input id="reader-width" type="range" min="800" max="1600" step="40" value="1280" />
        <div class="width-presets"><button id="fit-width" class="soft-button" aria-pressed="true">适应窗口</button><button id="comfort-width" class="soft-button">舒适宽度</button></div>
        <label for="reader-theme">外观</label><select id="reader-theme"><option value="system">跟随系统</option><option value="light">亮色</option><option value="dark">暗色</option></select>
        <p id="font-status" class="small muted">设置会自动记住，适用于所有文献。</p>
      </div></details>
    </div>
  </header>
  <aside id="outline-panel" class="outline" hidden="hidden"><div class="outline-heading"><strong>内容导航</strong><button id="close-outline" class="icon-button" aria-label="关闭导航">×</button></div><div class="outline-tabs"><button id="outline-sections" class="active">章节</button><button id="outline-figures">图表</button></div><nav id="outline"></nav><nav id="figure-outline" hidden="hidden"></nav></aside>
  <main id="reading-body" class="reading-body"></main>
  <div id="selection-tools" class="selection-tools" role="toolbar" aria-label="选段操作" hidden="hidden"><button data-selection="explain">解释</button><button data-selection="ask">提问</button><button data-selection="highlight">高亮</button><button data-selection="comment">批注</button><button data-selection="copy">复制</button><button data-selection="source">原文定位</button></div>
  <section id="annotation-editor" class="annotation-editor" role="dialog" aria-label="高亮与批注" hidden="hidden">
    <div class="editor-heading"><strong id="annotation-title">保存标注</strong><button id="annotation-close" class="icon-button" aria-label="关闭批注">×</button></div>
    <select id="annotation-choice" aria-label="选择重叠标注" hidden="hidden"></select><p id="annotation-quote" class="annotation-quote"></p><p id="annotation-hint" class="small muted"></p>
    <div id="annotation-colors" class="annotation-colors" role="group" aria-label="高亮颜色"></div>
    <label for="annotation-comment">批注</label><textarea id="annotation-comment" rows="3" placeholder="写下你的理解或疑问…"></textarea>
    <div class="annotation-actions"><button id="annotation-remove" class="text-button" hidden="hidden">删除标注</button><button id="annotation-source" class="text-button" hidden="hidden">查看原文</button><button id="annotation-save" class="primary">保存</button></div>
  </section>
  <div id="reader-feedback" class="reader-feedback" role="status" hidden="hidden"><span id="feedback-text"></span><button id="undo-annotation" class="text-button" hidden="hidden">撤销</button><button id="retry-layout" class="text-button" hidden="hidden">重试定位准备</button><button id="dismiss-feedback" class="icon-button" aria-label="关闭提示">×</button></div>
  <dialog id="figure-viewer" class="figure-viewer" aria-labelledby="figure-title">
    <header class="figure-window-heading"><div class="figure-heading-text"><span id="figure-label" class="figure-kicker">FIGURE</span><strong id="figure-title">图表</strong><span id="figure-paper" class="small muted"></span></div><div class="figure-window-actions"><button id="figure-source">查看原文 ↗</button><button id="figure-close" class="icon-button" aria-label="关闭图表">×</button></div></header>
    <div id="figure-split" class="figure-split">
      <section class="figure-image-pane" aria-label="原始图表"><div class="figure-pane-toolbar"><span class="figure-pane-label">原始图表</span><div class="figure-zoom-controls"><button id="figure-minus" aria-label="缩小图片">−</button><output id="figure-scale">100%</output><button id="figure-plus" aria-label="放大图片">＋</button><button id="figure-fit-width" aria-pressed="false">适合宽度</button><button id="figure-fit" aria-pressed="true">全图</button></div></div><div id="figure-stage" class="figure-stage" tabindex="0" aria-label="图表独立滚动区域"><img id="figure-image" alt="完整原图" /></div><footer class="figure-pane-footer"><span>滚动查看 · 放大后拖动图片</span><button id="figure-ask" class="text-button">问这张图 ↗</button></footer></section>
      <div id="figure-splitter" class="figure-splitter" role="separator" tabindex="0" aria-label="拖动调整两侧宽度，方向键微调，双击均分" aria-orientation="vertical" aria-valuemin="25" aria-valuemax="75" aria-valuenow="55"><span></span></div>
      <section class="figure-text-pane" aria-label="图表解读与标注"><div class="figure-pane-toolbar"><div class="figure-tabs" role="tablist" aria-label="图表内容"><button id="figure-tab-note" data-figure-tab="note" role="tab" aria-controls="figure-note-panel" aria-selected="true">图表解读</button><button id="figure-tab-caption" data-figure-tab="caption" role="tab" aria-controls="figure-caption-panel" aria-selected="false" tabindex="-1">双语图注</button><button id="figure-tab-chat" data-figure-tab="chat" role="tab" aria-controls="figure-chat-panel" aria-selected="false" tabindex="-1">对话</button><button id="figure-tab-annotations" data-figure-tab="annotations" role="tab" aria-controls="figure-annotations-panel" aria-selected="false" tabindex="-1">标注 <span id="figure-annotation-count">0</span></button></div><div class="figure-font-controls"><button id="figure-font-minus" aria-label="缩小图解文字">A−</button><button id="figure-font-plus" aria-label="放大图解文字">A+</button></div></div>
        <div id="figure-captions" class="figure-captions" tabindex="0" aria-label="图解与图注独立滚动区域"><section id="figure-note-panel" role="tabpanel" aria-labelledby="figure-tab-note"><div class="figure-reading-intro"><span class="figure-kicker">NATURE READER</span><h2>和原图一起，读懂这张图</h2><p class="small muted">选中文字，可提问、高亮或添加批注。</p></div><div id="figure-note-content"></div><button id="figure-explain" class="soft-button">解读图表</button></section><section id="figure-caption-panel" role="tabpanel" aria-labelledby="figure-tab-caption" hidden="hidden"></section><section id="figure-chat-panel" role="tabpanel" aria-labelledby="figure-tab-chat" hidden="hidden"><div id="figure-chat-empty" class="figure-chat-empty"><span class="figure-kicker">ASK THIS FIGURE</span><h2>一边看图，一边讨论</h2><p class="small muted">当前完整图表与图注会随问题一同提供。已有讨论继续保存在同一篇文献笔记中。</p></div><div id="figure-messages"></div></section><section id="figure-annotations-panel" role="tabpanel" aria-labelledby="figure-tab-annotations" hidden="hidden"></section></div>
        <form id="figure-chat-form" class="figure-chat-form" hidden="hidden">
          <div class="figure-composer-card">
            <div class="figure-chat-context"><svg xmlns="http://www.w3.org/2000/svg" class="figure-context-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg><div class="figure-context-copy"><strong id="figure-chat-label">当前图表</strong><span id="figure-chat-quote"></span></div><button id="figure-chat-clear" type="button" aria-label="清除引用选段" title="清除引用选段">×</button></div>
            <label for="figure-question">向图表提问</label><textarea id="figure-question" rows="2" aria-describedby="figure-chat-shortcut" placeholder="想进一步了解什么？也可以选中文字追问…"></textarea>
            <div class="figure-chat-actions"><span id="figure-chat-shortcut">Enter 发送 <span>·</span> Shift+Enter 换行</span><button id="figure-chat-stop" type="button" class="text-button" hidden="hidden">停止回答</button><button id="figure-chat-send" type="submit" class="primary"><span>发送</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5"/></svg></button></div>
          </div>
          <div class="figure-composer-bottom"><button id="figure-chat-back" type="button" class="text-button"><span aria-hidden="true">←</span> 返回图解</button><p id="figure-chat-status" class="small muted" role="status"></p></div>
        </form>
        <footer class="figure-pane-footer"><span id="figure-save-status" role="status">选段与批注自动同步到 Obsidian</span><button id="figure-undo" class="text-button" hidden="hidden">撤销</button></footer>
      </section>
    </div><footer class="figure-window-footer"><span>拖动中间分隔线调整宽度 · 双击均分</span><span id="figure-ratio">左图 55% / 右文 45%</span></footer>
  </dialog>
  <script src="chrome://zotero-nature/content/selection-text.js"></script><script src="chrome://zotero-nature/content/common.js"></script><script src="chrome://zotero-nature/content/paper-metadata.js"></script><script src="chrome://zotero-nature/content/reading-layout.js"></script><script src="chrome://zotero-nature/content/figure-chat.js"></script><script src="chrome://zotero-nature/content/reading-tools.js"></script><script src="chrome://zotero-nature/content/reader.js"></script>
</body></html>
